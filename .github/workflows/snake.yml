name: GitHub Snake Game

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate GitHub Contributions Snake Animations
        uses: Platane/snk@v3
        with:
          github_user_name: ClausMaslov
          outputs: |
            github-snake.svg
            github-snake-dark.svg?palette=github-dark
            ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post-process SVGs (Fix Y-offset bug & enhance dark theme)
        run: |
          node -e "
          const fs = require('fs');

          function processSvg(filename, isDark) {
            if (!fs.existsSync(filename)) return;
            let text = fs.readFileSync(filename, 'utf8');
            text = text.replace(/,-16px\)/g, ',0px)');

            if (isDark) {
              text = text.replace(
                /:root\{[^}]+\}/,
                ':root{--cb:#21262d;--cs:#c084fc;--c-head:#f0abfc;--ce:#161b22;--c0:#161b22;--c1:#0e4429;--c2:#006d32;--c3:#26a641;--c4:#39d353}'
              );
            } else {
              text = text.replace(
                /:root\{[^}]+\}/,
                ':root{--cb:#e1e4e8;--cs:#8b5cf6;--c-head:#a855f7;--ce:#ebedf0;--c0:#ebedf0;--c1:#9be9a8;--c2:#40c463;--c3:#30a14e;--c4:#216e39}'
              );
            }

            if (!text.includes('@media (prefers-color-scheme: dark)')) {
              const darkMedia = '@media (prefers-color-scheme: dark){:root{--cb:#21262d;--cs:#c084fc;--c-head:#f0abfc;--ce:#161b22;--c0:#161b22;--c1:#0e4429;--c2:#006d32;--c3:#26a641;--c4:#39d353}}';
              text = text.replace('</style>', darkMedia + '</style>');
            }

            fs.writeFileSync(filename, text, 'utf8');
          }

          processSvg('github-snake.svg', false);
          processSvg('github-snake-dark.svg', true);
          "

      - name: Push updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-snake.svg github-snake-dark.svg ocean.gif || true
          git commit -m "Update snake animation [skip ci]" || exit 0
          git push
